<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <!-- faint engineering grid -->
  <g stroke="#132238" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="1050" y1="0" x2="1050" y2="280"/>
  </g>

  <!-- flowing circuit paths -->
  <g stroke="url(#lineGrad)" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M40,230 L220,175 L400,205 L580,135 L760,185 L940,115 L1160,150" stroke-dasharray="9 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M60,55 L260,95 L460,60 L660,120 L860,70 L1060,130 L1160,90" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing nodes -->
  <g fill="#22d3ee">
    <circle cx="220" cy="175" r="3.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="135" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="115" r="3.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="95" r="3"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="120" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="130" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="url(#textGrad)">VARATHARAJAN K</text>
  <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="4" fill="#7d8fa3">AI &amp; DATA SCIENCE STUDENT · FULL-STACK ENGINEER · 3D SYSTEMS BUILDER</text>
</svg>
